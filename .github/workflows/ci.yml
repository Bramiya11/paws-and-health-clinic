name: CI — React Frontend

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'amplify.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'client/**'

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Lint
        run: npm run lint
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: client/dist/
          retention-days: 7
